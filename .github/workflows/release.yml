name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $sha = (git rev-parse --short HEAD)
          $date = Get-Date -Format "yyyy.MM.dd"
          $tag = "v0.1.$count"
          echo "tag=$tag"      >> $env:GITHUB_OUTPUT
          echo "title=$tag ($date, $sha)" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/NemoVoiceTyping/NemoVoiceTyping.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist --nologo

      - name: Rename asset for GitHub release
        shell: pwsh
        run: |
          Copy-Item "dist/Nemo Voice Typing.exe" "dist/Nemo-Voice-Typing.exe"

      - name: Extract latest changelog section
        id: changelog
        shell: pwsh
        run: |
          # Pull the newest entry (first "## ..." section) out of CHANGELOG.md
          # so the release body leads with the human-written notes. Falls back
          # to empty if the file is missing or has no sections yet.
          $notes = ""
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ') {
                if ($start -lt 0) { $start = $i } else { $notes = ($lines[$start..($i-1)] -join "`n").Trim(); break }
              }
            }
            if ($start -ge 0 -and -not $notes) { $notes = ($lines[$start..($lines.Count-1)] -join "`n").Trim() }
          }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $title = "${{ steps.ver.outputs.title }}"
          # Delete existing tag/release with the same name (idempotent re-runs)
          gh release delete $tag --yes --cleanup-tag 2>$null
          # --notes-file provides the changelog excerpt; --generate-notes makes
          # GitHub append a "What's Changed" commit list since the last release.
          gh release create $tag "dist/Nemo-Voice-Typing.exe" `
            --target ${{ github.sha }} `
            --title $title `
            --notes-file notes.md `
            --generate-notes `
            --latest
